name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --component rustfmt && rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --component clippy && rustup default stable
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85", stable]
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.rust }} && rustup default ${{ matrix.rust }}
      - run: cargo test ${{ matrix.features }}

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable && rustup default stable
      - run: cargo doc --no-deps

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable && rustup default stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
