[package]
authors = ["siwilizhao <siwilizhao@gmail.com>"]
categories = [
  "network-programming",
  "asynchronous",
  "web-programming::http-server",
]
description = "A minimal and ergonomic Rust web application framework"
documentation = "https://docs.rs/desire"
edition = "2024"
keywords = ["desire", "http", "web", "framework", "async"]
license = "Apache-2.0"
name = "desire"
publish = true
readme = "README.md"
repository = "https://github.com/desire-rs/desire"
version = "0.1.0"
rust-version = "1.85"

include = [
  "Cargo.toml",
  "LICENSE",
  "src/**/*",
]

[features]
default = []
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]

[dependencies]
bytes = "1"
cookie = "0.18"
futures-core = "0.3"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
httpdate = "1"
matchit = "0.8"
mime_guess = "2"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
tracing = "0.1"

[dev-dependencies]
tokio-stream = "0.1"
tracing-subscriber = "0.3"

[[example]]
name = "tls"
required-features = ["tls"]
